<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตัวเส้นชวนคิด — Content Calendar 30 วัน</title>
<style>
:root {
  --bg:#f5f6f8; --panel:#ffffff; --text:#17181b; --muted:#70757d;
  --line:#e6e8ec; --accent:#111827; --soft:#eef1f5; --green:#157347;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1120px;margin:auto;padding:24px}
.hero{display:flex;gap:18px;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:clamp(26px,4vw,42px);margin:0;line-height:1.15}
.sub{color:var(--muted);margin-top:8px}
.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
input[type=date]{min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
button{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer}
button:hover{background:var(--soft)} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.35fr);gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h2{font-size:18px;margin:0 0 14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.month-title{font-weight:800}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1/1;min-width:0;border:1px solid transparent;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;font-weight:700}
.day.muted{color:#c3c6cb}
.day.plan{background:#f4f6f8;border-color:#eceef1}
.day.selected{background:var(--accent);color:#fff}
.day .tag{font-size:9px;font-weight:700;opacity:.65}
.day.selected .tag{opacity:.85}
.day.today{outline:2px solid #aab0b8;outline-offset:1px}
.status{font-size:13px;color:var(--muted);padding:10px 12px;background:var(--soft);border-radius:10px;margin-bottom:14px}
.schedule-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.schedule-date{font-size:24px;font-weight:900;line-height:1.2}
.dayno{display:inline-block;font-size:12px;background:var(--soft);padding:5px 8px;border-radius:999px;color:var(--muted);margin-top:7px}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.time{font-size:20px;font-weight:900;letter-spacing:-.02em}
.topic{font-weight:700;line-height:1.45}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.topic-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.topic-row .topic{min-width:0;flex:1}
.copy-btn{min-height:36px;min-width:66px;padding:0 10px;font-size:12px;flex:0 0 auto}
.copy-btn.copied{border-color:var(--green);color:var(--green);background:#f3faf6}
.empty{padding:28px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.footer{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.6}
.backup-title{font-size:13px;font-weight:800;color:var(--muted);margin:18px 0 8px}
.backup-list{display:grid;gap:8px}
.backup-item{padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:#fafbfc;line-height:1.45}
.backup-badge{display:inline-block;font-size:11px;font-weight:800;color:var(--green);margin-right:8px}
@media(max-width:760px){
 .wrap{padding:15px} .grid{grid-template-columns:1fr} .panel{padding:14px}
 .item{grid-template-columns:68px 1fr} .time{font-size:18px}
 .day{border-radius:9px;font-size:13px} .day .tag{font-size:8px}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div>
      <h1>Content Calendar — ตัวเส้นชวนคิด</h1>
      <div class="sub">30 วัน · 5 คลิปต่อวัน · รวม 150 คลิป + ไอเดียสำรองวันละ 2 หัวข้อ</div>
    </div>
    <div class="controls">
      <div>
        <label for="startDate">วันที่เริ่มแผน</label>
        <input id="startDate" type="date">
      </div>
      <button id="todayBtn" type="button">วันนี้</button>
      <button id="firstBtn" class="primary" type="button">ไปวันที่ 1</button>
    </div>
  </section>
  <div class="grid">
    <section class="panel">
      <div class="cal-head">
        <button id="prevMonth" type="button" aria-label="เดือนก่อน">‹</button>
        <div id="monthTitle" class="month-title"></div>
        <button id="nextMonth" type="button" aria-label="เดือนถัดไป">›</button>
      </div>
      <div class="week"><span>อา.</span><span>จ.</span><span>อ.</span><span>พ.</span><span>พฤ.</span><span>ศ.</span><span>ส.</span></div>
      <div id="calendar" class="calendar" aria-label="ปฏิทินเลือกวัน"></div>
      <div class="footer">วันที่มีพื้นหลังคือช่วง 30 วันของแผน คลิกวันที่เพื่อดูหัวข้อและเวลาโพสต์</div>
    </section>
    <section class="panel">
      <div class="schedule-head">
        <div>
          <div id="scheduleDate" class="schedule-date">เลือกวันที่จากปฏิทิน</div>
          <div id="dayNo" class="dayno" hidden></div>
        </div>
        <div style="display:flex;gap:6px">
          <button id="prevDay" type="button">←</button>
          <button id="nextDay" type="button">→</button>
        </div>
      </div>
      <div id="status" class="status">ตั้ง “วันที่เริ่มแผน” แล้วเลือกวันในปฏิทินได้เลย</div>
      <div id="scheduleList" class="list"></div>
      <div id="backupTitle" class="backup-title" hidden>ไอเดียสำรอง 2 หัวข้อ</div>
      <div id="backupList" class="backup-list"></div>
    </section>
  </div>
</div>
<script src="schedule.js"></script>
<script src="backups.js"></script>
<script src="app.js"></script>
</body>
</html>
